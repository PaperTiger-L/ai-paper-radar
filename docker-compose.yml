services:
  paper-radar:
    build: .
    container_name: ai-paper-radar
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/paper_radar.db
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      # SQLite 数据持久化：容器重建/重启不丢失数据
      - ./data:/app/data
    restart: unless-stopped
